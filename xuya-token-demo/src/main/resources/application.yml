server:
  port: 8080

xuya:
  token:
    header-name: Authorization
    token-prefix: "Bearer "
    timeout-millis: 1800000   # 30 minutes idle timeout
    max-sessions-per-user: 2  # 顶替登录:同一用户最多 2 个并发会话,超出踢最旧
    permission-cache-ttl-millis: 60000
    exclude-paths:
      - /login
      - /c/login
      - /error
    # 多体系(端)策略:C 端 30 天免登录,B 端沿用全局 30 分钟
    user-types:
      c:
        timeout-millis: 2592000000
    # 体系路径隔离:C 端 token 访问管理端接口直接 403,反之亦然
    user-type-paths:
      b: [/admin/**, /profiles/**, /orders]
      c: [/c/**]
    # 鉴权解释调试端点:GET /xuya/auth/explain?expr=profile:delete(需登录)
    explain-enabled: true
    # 登录防爆破:连续失败 5 次锁定 5 分钟(按体系:账号计数)
    guard-max-failures: 5
    guard-lock-millis: 300000
    # JWT 无状态模式示例(需引入 xuya-token-jwt 依赖;与 Redis 会话二选一):
    # jwt:
    #   secret: "change-me-at-least-32-bytes-long-secret"

spring:
  application:
    name: xuya-token-demo

logging:
  level:
    dev.xuya: debug
